  <div class="module">
    <h2>Resetting the cache</h2>

    <form method="post" class="cache-form">
      {% csrf_token %}

      <div class="form-row">
        <h3>Reset the cache</h3>
        {% for app in cache_apps %}
          <button type="submit" name="reset_{{ app }}_cache" class="button">
            {{ app|title }}
          </button>
        {% endfor %}
      </div>
    </form>
  </div>
