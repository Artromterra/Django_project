{% extends "base.html" %}

{% load i18n %}


{% block header %}
  {% include 'header_for_authorization.html' %}
{% endblock %}


{% block content %}
  <main class="Middle">
    <div class="wrap">
      <div class="row Header-rowMain">
        <div class="row-block Header-logo">
          <a class="logo" href="{% url 'homepage' %}">
            <img class="logo-image" src="/static/assets/img/logo.png" alt="logo.png" />
          </a>
        </div>
      </div>
      <div class="wrapper">
        <div class="header">
          <h3 class="sign-in">
            {% translate "Регистрация" %}</h3>
        </div>
        <div class="clear"></div>
        <form action="#" method="post">
          {% csrf_token %}
          {{ form.as_div }}
          <input type="submit" value="Зарегистрироваться" />
          <a class="registr" href="{% url 'profiles:login' %}">
            {% translate "Вход" %}</a>
          <div class="clear"></div>
        </form>
      </div>
    </div>
  </main>
{% endblock %}
